<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Eyad Oraby · Mobile & Web Engineer</title>
    <meta name="description" content="Eyad Oraby, software engineer building Flutter mobile apps and Next.js web apps. Work, projects and a little more." />
    <meta property="og:title" content="Eyad Oraby · Mobile & Web Engineer" />
    <meta property="og:description" content="Flutter mobile apps and Next.js web products, with case studies and real screenshots." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" /></noscript>
    <!-- Arabic loads with display=optional: it is used when it arrives in time, so the Arabic page never shifts after first paint. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=optional" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=optional" /></noscript>
    <script>
      // Opened straight on Projects: start its first screenshot before the app loads.
      // Kept in step with the first case study by src/__tests__/preload.test.ts.
      if (/^#projects(\/|$)/.test(location.hash)) {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = "/shots/rsvp-builder.webp";
        l.setAttribute("imagesrcset", "/shots/rsvp-builder-640.webp 640w, /shots/rsvp-builder.webp 1280w");
        l.setAttribute("imagesizes", "(max-width: 760px) 92vw, 640px");
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
